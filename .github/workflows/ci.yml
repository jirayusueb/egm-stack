name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Validate
        run: npm run validate
      - name: Build freshness
        run: npm run build:check
      - name: Embedded assets freshness
        run: node scripts/sync-assets.mjs --check
      - name: Eval coverage
        run: node scripts/eval.mjs --check
      - name: Description coverage
        run: node scripts/describe-eval.mjs --check
      - name: Regressions
        run: node scripts/check-regressions.mjs

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skills CLI discovers the roster
        run: npx --yes skills add . --list | tee /tmp/skills.txt
      - name: Roster count is 47
        run: grep -q "Found 47 skills" /tmp/skills.txt
