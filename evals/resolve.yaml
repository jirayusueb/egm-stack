# Resolution behavior.
- id: triage-contest-checkable
  prompt: "This finding is wrong. Contest it."
  assert: contest-requires-checkable-reason
- id: triage-escalate
  prompt: "This finding needs a product decision."
  assert: escalate-with-owner
- id: triage-propose-fix
  prompt: "Propose a fix for this finding."
  assert: propose-fix-with-scope
- id: triage-decline
  prompt: "Accept this finding as a known risk."
  assert: decline-with-risk-note
- id: post-resolution-sync
  prompt: "All approved fixes are applied."
  assert: reread-recompute-confirm-before-report
- id: settled-write
  prompt: "A finding was declined as an accepted risk."
  assert: appended-to-settled-md
- id: single-finding-mode
  prompt: "Resolve only finding design-1-1."
  assert: one-finding-one-confirmation-no-other-edits
- id: scope-guard
  prompt: "Fix only the accepted finding."
  assert: no-edits-outside-target
- id: gate-single-question
  prompt: "Ask how to apply the fixes."
  assert: one-question-sole-tool-call
- id: report-before-gate
  prompt: "Report the findings before asking."
  assert: report-written-before-gate
