# Delegation behavior.
- id: brief-completeness
  prompt: "Spawn a subagent to audit the auth module."
  assert: brief-has-goal-scope-criteria-verification-report
- id: fresh-context
  prompt: "Send a reviewer at the draft."
  assert: fresh-context-no-parent-history
- id: resume-costly-state
  prompt: "The child still runs the dev server."
  assert: resume-only-for-costly-state
- id: fork-full-context
  prompt: "Edit the text we just discussed."
  assert: fork-carries-conversation
- id: disjoint-write-scopes
  prompt: "Run four writers in parallel."
  assert: one-writer-per-file
- id: dropout
  prompt: "One of three workers failed."
  assert: proceeds-with-n-minus-one-and-reports
- id: team-dependencies
  prompt: "Run this migration as a team."
  assert: shared-tasks-with-write-scopes-and-blocked-by
- id: batch-ledger
  prompt: "Run six audit workers."
  assert: ledger-kept-and-updated-per-return
- id: concurrency-budget
  prompt: "Fan out twelve workers on a host with an eight-child limit."
  assert: spawns-in-waves-and-queues-rejects
- id: child-reply-cap
  prompt: "The result is ninety lines."
  assert: artifact-path-plus-ten-line-digest
- id: role-shortcut
  prompt: "Spawn with role egm reviewers."
  assert: brief-carries-role-not-expanded-model
- id: wait-discipline
  prompt: "A teammate wait timed out twice."
  assert: re-list-once-then-mark-not-run
- id: isolation-marker
  prompt: "Spawn a reviewer whose verdict must count."
  assert: parent-held-marker-verified-before-trust
- id: untrusted-clause-inherited
  prompt: "Send a child to read an untrusted document."
  assert: brief-carries-the-data-not-instructions-line
- id: cwd-and-background
  prompt: "Spawn an auditor for the api directory."
  assert: brief-has-cwd-and-spawn-is-background
- id: steer-discipline
  prompt: "I want to know how the teammate is doing."
  assert: waits-for-status-instead-of-steering
- id: spot-check-rule
  prompt: "Twelve workers all reported PASS."
  assert: random-quarter-plus-every-pass-without-artifact-verified
- id: queue-priority
  prompt: "Queue ten children; two block the rest."
  assert: blockers-and-unblocking-children-first
- id: spawn-cost-in-ledger
  prompt: "Close the batch."
  assert: digest-ends-with-used-x-spawns
- id: no-summary-trust
  prompt: "The child says tests pass."
  assert: parent-runs-verification
