# Review engine behavior. Live runs follow docs/evals.md.
- id: plan-preview
  prompt: "Run a full review. What will it cost?"
  assert: prints-stages-reviewers-spawns-and-cap-before-dispatch
- id: full-panel
  prompt: "Run the spec profile with every reviewer."
  assert: nine-reviewers-completed-and-recorded
- id: quick-preset-short-doc
  prompt: "Review this 30-line README."
  assert: offers-quick-before-full-panel
- id: resume-mid-review
  prompt: "Continue the review. Stages 1 and 2 already have reports."
  assert: offers-resume-from-stage-3
- id: author-map
  prompt: "Write the consolidated report with unsettled findings."
  assert: severity-sorted-map-with-next-action-and-line-refs
- id: digest-in-report
  prompt: "Write the consolidated report."
  assert: three-line-digest-and-count-line-first
- id: panel-warning
  prompt: "Run the full panel. One reviewer is unavailable."
  assert: preview-names-the-missing-reviewer
- id: usage-line
  prompt: "Finish the consolidated report."
  assert: usage-line-with-spawns-rounds-not-run-cap
- id: progress-ticker
  prompt: "Run the review."
  assert: one-line-announcement-per-stage-dispatch
- id: isolation-verified
  prompt: "Run a review whose verdict will gate the release."
  assert: parent-held-marker-check-before-trusting-the-round
- id: settled-registry
  prompt: "Review again. Earlier rounds declined some findings."
  assert: settled-list-passed-and-not-reaised
- id: specs-profile
  prompt: "Check every design doc for contradictions."
  assert: reads-all-docs-designs-finds-conflicts
- id: re-audit-cap
  prompt: "The user asks to re-run the same stage after editing twice."
  assert: one-reaudit-then-cap-and-advance
- id: pause-and-edit-option
  prompt: "Present a stage checkpoint."
  assert: pause-and-edit-option-offered
- id: link-protocol
  prompt: "The target links a relative file, an anchor, and an outside symlink."
  assert: anchor-skipped-relative-resolved-outside-asked
- id: early-exit-clean
  prompt: "Stage 1 found zero blockers on a capped run."
  assert: offers-to-stop-with-what-remains
- id: early-exit-blocker
  prompt: "Stage 1 found a blocker that invalidates the premise."
  assert: offers-return-to-drafting
- id: fast-preset-parallel
  prompt: "Run the fast preset."
  assert: stages-one-and-two-dispatched-together
- id: diff-scoped-reaudit
  prompt: "Re-audit the stage after a ten-line edit."
  assert: changed-ranges-plus-context-not-whole-file
- id: stage-report-cap
  prompt: "Write the stage report."
  assert: table-status-verdict-only-no-narrative
- id: context-plan-row
  prompt: "Show the plan preview."
  assert: parent-resident-and-child-resident-named
- id: stage-order
  prompt: "Run a full interactive review of the draft."
  assert: reports-written-in-stage-order
- id: fresh-context-stop
  prompt: "Review the draft on a host with no subagent tool."
  assert: stops-without-reviewing-in-context
- id: comprehension-no-context
  prompt: "Run the comprehension stage on the draft."
  assert: stage-2-gets-document-only
- id: profile-spec
  prompt: "Review the spec with the spec profile."
  assert: profile-spec-reviewers
- id: profile-plan
  prompt: "Review the implementation plan."
  assert: profile-plan-reviewers
- id: profile-doc
  prompt: "Review this README."
  assert: profile-doc-reviewers
- id: code-two-axis
  prompt: "Review the branch diff since main."
  assert: standards-and-spec-axes-in-parallel-with-pinned-point
- id: spec-discovery
  prompt: "Review this diff. No spec was named."
  assert: discovery-order-then-no-spec-available-not-a-stop
- id: profile-code
  prompt: "Review the working tree diff."
  assert: profile-code-reviewers
- id: profile-ddd
  prompt: "Review the domain model with the ddd profile."
  assert: profile-ddd-uses-domain-standard
- id: profile-comments
  prompt: "Run the comment review."
  assert: profile-comments-read-only
- id: loop-converged
  prompt: "Keep reviewing until the findings settle."
  assert: two-consecutive-clean-rounds
- id: loop-not-run
  prompt: "A reviewer failed twice. Finish the round."
  assert: not-run-makes-round-unclean
- id: loop-cap
  prompt: "The review is at five rounds."
  assert: stops-and-asks
- id: loop-churn
  prompt: "A new finding would revert the last fix."
  assert: churn-stops-and-asks
- id: resolve-handoff
  prompt: "Hand the findings to resolve."
  assert: waits-for-human-between-rounds
- id: report-vocabulary
  prompt: "Write the review report."
  assert: fixed-severity-and-status-vocabulary
